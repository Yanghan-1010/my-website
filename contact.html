<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Huang Yanghan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <nav class="container">
            <div class="logo">YH.HUANG</div>
            <ul class="nav-links">
                <li><a href="index.html" id="nav-home">Home</a></li>
                <li><a href="about.html" id="nav-about">About</a></li>
                <li><a href="projects.html" id="nav-projects">Projects</a></li>
                <li><a href="hobbies.html" id="nav-hobbies">Hobbies</a></li>
                <li><a href="contact.html" id="nav-contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section style="padding: 4rem 0 2rem 0;">
            <h1>Get In Touch</h1>
            <p style="color: #777;">I am always open to discussing new projects or opportunities.</p>
        </section>
        <div class="contact-wrapper">
            <section class="contact-info">
                <div class="info-item">
                    <h2>Email</h2>
                    <a href="mailto:1240020175@student.must.edu.mo">1240020175@student.must.edu.mo</a>
                </div>
                <div class="info-item">
                    <h2>Phone</h2>
                    <p>+853 XXXX XXXX</p>
                </div>
                <div class="info-item">
                    <h2>Location</h2>
                    <p>Macao SAR, China</p>
                </div>
            </section>
            <section class="contact-form">
                <form action="#">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="e.g. Alex Zhang" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="e.g. alex@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="4" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="btn primary" style="width: 100%; cursor: pointer;">Send Message</button>
                </form>
            </section>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2026 Huang Yanghan. Faculty of Innovation Engineering, MUST.</p>
        </div>
    </footer>

    <script>document.getElementById('nav-contact').classList.add('active');</script>
</body>
</html>
